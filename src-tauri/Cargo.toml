[package]
name = "aterm"
version = "0.1.0"
description = "AI Agent Orchestration Terminal"
authors = []
edition = "2021"

[lib]
name = "aterm_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.6.0"
portable-pty = "0.9"
dirs = "5"
