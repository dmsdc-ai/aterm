[package]
name = "aterm-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
aterm-ipc = { path = "../aterm-ipc" }
aterm-session = { path = "../aterm-session" }
libc = "0.2"
alacritty_terminal = "0.26.0-rc1"
dirs = "6"
glyphon = "0.7"
portable-pty = "0.9"
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tsnet = "0.1.0"
wgpu = "23"

[build-dependencies]
cbindgen = "0.27"
