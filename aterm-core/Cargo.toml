[package]
name = "aterm-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
aterm-ipc = { path = "../aterm-ipc" }
aterm-session = { path = "../aterm-session" }
alacritty_terminal = "0.26.0-rc1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsnet = "0.1.0"
unicode-normalization = "0.1"
