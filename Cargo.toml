[workspace]
members = [".", "aterm-core", "aterm-session", "aterm-ipc"]

[package]
name = "aterm-v3"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "aterm-v3"
path = "src-v3/main.rs"

[dependencies]
alacritty_terminal = "0.26.0-rc1"
dirs = "6"
glyphon = "0.7"
portable-pty = "0.9"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
wgpu = "23"
winit = { path = "../winit", features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSTextInputClient", "NSTextInputContext", "NSView", "NSApplication", "NSRunningApplication", "NSWindow", "NSResponder"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSAttributedString", "NSGeometry", "NSRange", "NSString"] }
