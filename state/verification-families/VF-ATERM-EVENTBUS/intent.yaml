schema_version: 1
id: VF-ATERM-EVENTBUS
feature: event-driven state waits and completion signalling
intent: >
  Verify event-driven waiting semantics (Condvar wake on terminal state, timeout) and MarkComplete state/report handling without timer-based polling.
profile: unit
package: aterm-core
source_files:
  - aterm-core/src/app.rs
inventory_source: state/tests.md
selectors:
  - "app::tests::wait_for_state_"
  - "app::tests::mark_complete_"
tests:
  - wait_for_state_returns_early_on_terminal_state
  - wait_for_state_times_out
  - mark_complete_dead_workspace_errors
  - mark_complete_sets_state_and_report
  - mark_complete_unknown_workspace_errors
  - mark_complete_wakes_condvar_waiter
