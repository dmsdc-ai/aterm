schema_version: 1
id: VF-ATERM-EVENTBUS
feature: typed events and task queue snapshot updates
intent: >
  Verify event-driven waiting semantics and task queue snapshot refreshes without timer-based polling.
profile: integration
package: aterm-core
target: polling_event_tests
source_files:
  - aterm-core/tests/polling_event_tests.rs
inventory_source: state/tests.md
selectors:
  - "wait_until_"
  - "task_queue_"
tests:
  - task_queue_file_change_detected
  - task_queue_reload_reads_updated_content
  - wait_until_blocks_until_workspace_reaches_target_state
  - wait_until_returns_immediately_if_already_in_target_state
  - wait_until_status_change_notifies_all_waiters
  - wait_until_timeout_returns_after_specified_duration
