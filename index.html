<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aterm</title>
  </head>
  <body>
    <!-- Loading spinner — visible until Svelte mounts -->
    <div id="loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#faf6f0;flex-direction:column;gap:16px;font-family:-apple-system,system-ui,sans-serif;z-index:9999;">
      <div style="font-family:monospace;font-size:32px;letter-spacing:-0.05em;color:#d4a574;">
        <span style="color:#06b6d4;">·</span><span style="color:#d4a574;">⣿</span><span style="color:#06b6d4;">·</span>
      </div>
      <div style="font-size:14px;color:#8a7e74;">Loading aterm...</div>
      <div id="loader-error" style="display:none;color:#d96c6c;font-size:11px;max-width:400px;text-align:center;padding:8px;"></div>
    </div>
    <div id="app"></div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('loader-error');
        if (el) { el.style.display='block'; el.textContent = 'Error: ' + e.message; }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('loader-error');
        if (el) { el.style.display='block'; el.textContent = 'Error: ' + (e.reason?.message || e.reason); }
      });
      // Auto-reload if app doesn't mount within 5 seconds
      window.__atermMountTimeout = setTimeout(function() {
        var loader = document.getElementById('loader');
        if (loader && loader.style.display !== 'none') {
          var el = document.getElementById('loader-error');
          if (el) { el.style.display='block'; el.textContent = 'Retrying...'; }
          setTimeout(function() { location.reload(); }, 500);
        }
      }, 5000);
      window.__atermClearMountTimeout = function() {
        clearTimeout(window.__atermMountTimeout);
      };
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
